name: Update Items

# Moves the items onto the current game build without a WoW install, and nothing else: db2tool reads
# the current wow_classic_beta build off Blizzard's CDN and overlays the latest hotfix cache, the same
# way the Update DB workflow does. `make db CLASSES=none SHARED=0` then takes only the items spell data
# group (the item, enchant and set-bonus rows, with the item database gen_db writes). Every class, the
# racials and the shared rows stay on the build the committed inputs record (see
# docs/spell_data/partial-updates.md). Whatever changed lands in a pull request; nothing changed means
# no pull request.
on: workflow_dispatch

env:
    PRODUCT: wow_classic_beta
    DBCACHE_URL: https://storage.googleapis.com/raidbots-static/wow/classic_beta/enUS/DBCache.bin

jobs:
    update-items:
        runs-on: self-hosted
        timeout-minutes: 30
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Checkout 🛎️
              uses: actions/checkout@v5

            - name: Install Go
              uses: actions/setup-go@v6
              with:
                  go-version: 1.25.x
                  cache: false

            - name: Install Protoc
              uses: arduino/setup-protoc@v3
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install Protoc Go plugin
              run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

            - name: Install Node
              uses: actions/setup-node@v5
              with:
                  node-version: 22

            - name: Install npm dependencies
              run: npm ci

            # The version service names the build the CDN currently serves. Its build config hash keys
            # the download cache below, so a re-run for the same build fetches nothing from the CDN.
            - name: Resolve the current beta build 🔎
              id: build
              run: |
                  row=$(curl -fsS "https://us.version.battle.net/$PRODUCT/versions" | awk -F'|' '$1 == "us"')
                  config=$(echo "$row" | cut -d'|' -f2)
                  version=$(echo "$row" | cut -d'|' -f6)
                  test -n "$config" && test -n "$version"
                  echo "Current $PRODUCT build: $version (build config $config)"
                  echo "config=$config" >> "$GITHUB_OUTPUT"
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Cache CDN downloads and definitions 📦
              uses: actions/cache@v4
              with:
                  path: |
                      tools/db2tool/cdncache
                      tools/db2tool/DBDCache
                      tools/db2tool/listfile.csv
                      tools/db2tool/TACTKeys.txt
                  key: db2tool-${{ env.PRODUCT }}-${{ steps.build.outputs.config }}

            - name: Download the latest hotfix cache ⚡
              run: |
                  mkdir -p tools/db2tool/caches
                  curl -fsSL -o tools/db2tool/caches/DBCache.bin "$DBCACHE_URL"

            # gen_db imports the Go protos, so they are generated from the committed .proto files
            # first. Taking no class, gen_db rewrites no .proto file, so they need no second pass.
            - name: Bootstrap the Go protos and the dist stub 🧬
              run: make sim/core/proto/api.pb.go binary_dist/dist.go

            # db2tool warns (and carries on) when the hotfix cache is for another build than the CDN
            # serves, which happens around a build push; the pull request says which it was. The
            # spell data change report goes into the pull request body.
            - name: Extract game files data and regenerate the items 🔧
              id: db
              run: |
                  set -o pipefail
                  make db CLASSES=none SHARED=0 DB2TOOL_FLAGS="--cdn --dbcache tools/db2tool/caches/DBCache.bin" 2>&1 | tee "$RUNNER_TEMP/db.log"
                  if grep -q 'none of the given --dbcache files hold hotfixes' "$RUNNER_TEMP/db.log"; then
                      echo "hotfixes=NOT applied: the downloaded DBCache.bin is for a different build" >> "$GITHUB_OUTPUT"
                  else
                      echo "hotfixes=$(grep -m1 'Loaded hotfixes' "$RUNNER_TEMP/db.log" | sed 's/.*for build/applied, DBCache.bin for build/')" >> "$GITHUB_OUTPUT"
                  fi
                  {
                      echo "report<<REPORT_EOF"
                      grep -E '^(spelldata: (items |  [+~-] |shared row |row |spell )|kept, not ported)' "$RUNNER_TEMP/db.log" | head -n 200 || true
                      echo "REPORT_EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Check the regenerated code builds 🧪
              run: |
                  go build ./...
                  go test ./tools/database/
                  npm run type-check

            - name: Set date
              id: date
              run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

            - name: Create Pull Request 🚀
              uses: peter-evans/create-pull-request@v7
              with:
                  branch: update_items
                  delete-branch: true
                  commit-message: '[DB] Update items to ${{ steps.build.outputs.version }} with hotfixes as of ${{ steps.date.outputs.date }}'
                  title: '[DB] Update items to ${{ steps.build.outputs.version }} with hotfixes as of ${{ steps.date.outputs.date }}'
                  body: |
                      The items spell data group and the item database, regenerated from the `${{ env.PRODUCT }}` build on Blizzard's CDN. Every class, the racials and the shared rows stay on their committed builds.

                      - Build: ${{ steps.build.outputs.version }}
                      - Hotfixes: ${{ steps.db.outputs.hotfixes }} (from ${{ env.DBCACHE_URL }})
                      - Ran `make db CLASSES=none SHARED=0 --cdn`; the Go builds, the generator tests pass and the UI type-checks

                      ```
                      ${{ steps.db.outputs.report }}
                      ```
